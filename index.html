<title>Misi Bakul Nombor</title>
<style>
*{box-sizing:border-box;margin:0}

.bks{display:flex;gap:clamp(8px,3vw,36px);align-items:flex-end;justify-content:center}
.b3{display:flex;flex-direction:column;align-items:center;gap:2px;width:clamp(84px,21vmin,150px);touch-action:none;cursor:pointer;transition:scale .15s}.b3.drg{z-index:30;scale:1.15;cursor:grabbing}.b3.pk{scale:1.1;filter:drop-shadow(0 0 8px #f59e0b)}
.bl{font-weight:900;font-size:clamp(.75rem,2.2vmin,1rem);background:#fffd;border-radius:99px;padding:0 10px}
.bi{min-height:1.3em;width:92%;display:flex;flex-wrap:wrap;justify-content:center;font-size:clamp(.85rem,2.8vmin,1.3rem);line-height:1;margin-bottom:-.8em;z-index:1}
.bw{position:relative;line-height:1}.bb{font-size:clamp(3.2rem,11vmin,5.6rem);filter:drop-shadow(0 6px 4px #0003)}
.bn{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:clamp(1.4rem,5vmin,2.4rem);color:#fff;-webkit-text-stroke:2px #8a5a1e;paint-order:stroke fill}
.bd{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:72%}.bd i{aspect-ratio:1;border-radius:50%;border:2px solid #f59e0b;background:#fff}.bd i.f{background:#f59e0b}
.sl{position:relative;width:clamp(96px,23vmin,170px);min-height:clamp(110px,28vmin,200px);border:4px dashed #fff;border-radius:22px;background:#fff6;display:flex;align-items:center;justify-content:center}.sl small{position:absolute;top:2px;left:10px;font-weight:900;color:#1f6f4a}
.dir{background:#fff;border:3px solid #ffb02e;border-radius:99px;padding:4px 20px;font-weight:900;font-size:clamp(1rem,3vmin,1.5rem)}
.col.f3 .b3{width:clamp(74px,17vmin,124px)}.col.f3 .bb{font-size:clamp(2.6rem,8.6vmin,4.5rem)}.col.f3 .bn{font-size:clamp(1.2rem,4vmin,2rem)}
.stair{position:relative;padding:0 8px}.stair .bks{gap:4px;align-items:flex-end;position:relative;z-index:1}
.arw{position:absolute;left:8%;right:8%;top:48%;border-top:7px dashed #f97316;transform:rotate(-13deg);transform-origin:left center;z-index:0;opacity:.9}
.arw.dn{top:30%;transform:rotate(13deg)}.arw:after{content:"";position:absolute;right:-8px;top:-16px;border-left:20px solid #f97316;border-top:12px solid transparent;border-bottom:12px solid transparent}
.sl.st{border:0;background:none;min-height:0;padding:0;flex-direction:column;justify-content:flex-end;width:clamp(80px,19vmin,134px)}

.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.5vw,14px);width:min(760px,96vw)}

/* Kamera memenuhi latar seluruh skrin, bukan pratonton kecil di penjuru. */
#cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;object-fit:cover;object-position:center center;transform:scaleX(-1);z-index:1;display:none;pointer-events:none;border:0;border-radius:0;box-shadow:none;background:#193a32}
body.camera-active .bg{visibility:hidden;opacity:0}
/* Serpihan bintang mengikuti jari, hilang secara automatik. */
#camStars{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
.cam-spark{position:absolute;left:0;top:0;pointer-events:none;line-height:1;font-size:clamp(21px,3vw,30px);text-shadow:0 2px 4px #0008;opacity:0;animation:cam-spark-fade var(--ttl,.76s) ease-out forwards;will-change:transform,opacity}

#bCam{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:45;width:112px;height:112px;padding:0;background:linear-gradient(150deg,#fff8b3 0%,#ffd05e 50%,#f59d35 100%);color:#654008;border:none;border-radius:0;box-shadow:none;clip-path:polygon(50% 0%,61% 31%,97% 34%,70% 56%,80% 92%,50% 73%,20% 92%,30% 56%,3% 34%,39% 31%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:950;filter:drop-shadow(0 7px 6px #0005);transition:transform .15s ease,filter .15s ease}
#bCam .cam-icon{display:block;line-height:1;font-size:2.15rem;pointer-events:none}#bCam .cam-label{font-size:.67rem;line-height:1.05;letter-spacing:.3px;pointer-events:none}
#bCam.on{background:linear-gradient(150deg,#dbffa2,#8cf17d 60%,#41bd86);color:#174b31}

#bR[aria-expanded="true"]{background:#ffe09a;color:#5b3a00}
.range-menu{position:absolute;top:54px;right:52px;z-index:29;width:min(250px,calc(100vw - 22px));padding:14px;border:3px solid #e6aa42;border-radius:20px;background:#fffdf4;box-shadow:0 10px 30px #0003;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center}

el.onpointermove=e=>{if(!dr)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mv=1;if(mv)el.style.translate=`${dx}px ${dy}px`};

paint();say(f==1?`Hai ${S.name}! Naik bukit! Letak bakul PALING SEDIKIT epal di tangga 1, kemudian tangga 2, dan PALING BANYAK di tangga 3.`:'Sekarang turun bukit! Letak bakul PALING BANYAK epal di tangga 1, kemudian tangga 2, dan PALING SEDIKIT di tangga 3.',1)}
function end(){show('sEnd');$('#eT').textContent=`Tahniah, ${S.name}! 🎉`;$('#eH').innerHTML=hero(S,'cheer');$('#eS').textContent=`Kamu dapat ⭐ ${S.stars} bintang!`;conf();sfx.ok();speak(`Tahniah ${S.name}! Kamu hebat!`);setTimeout(conf,1400)}
$('#eAgain').onclick=()=>{S.stars=0;show('game');$('#game').classList.add('on');$('#hero').innerHTML=hero(S);startM(0)};$('#eChar').onclick=gen;

const rangeMenu=$('#rangeMenu'),rangeGear=$('#bR');

(()=>{const spc=Element.prototype.setPointerCapture;Element.prototype.setPointerCapture=function(i){if(i===99)return;try{spc.call(this,i)}catch(e){}};
const C={on:0,loading:0,requestId:0,x:0,y:0,pin:0,t0:0,cool:0,lost:0,lt:-1},hc=$('#hc'),cv=$('#cv');window.CAMC=C;
const camStars=$('#camStars'),sparkPalette=['#ffe45b','#ff82bd','#67e0ff','#a4ff79','#ffc06e','#cf9aff'];let lastSparkAt=0;
function updateCameraUI(active){const b=$('#bCam');document.body.classList.toggle('camera-active',active);b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active));b.setAttribute('aria-label',active?'Matikan webcam':'Hidupkan webcam');b.title=active?'Matikan webcam':'Hidupkan webcam';b.innerHTML=`<span class="cam-icon" aria-hidden="true">📷</span><span class="cam-label">${active?'AKTIF':'KAMERA'}</span>`}
function sparkleAt(x,y,t){if(!C.on||!Number.isFinite(x)||!Number.isFinite(y)||t-lastSparkAt<55)return;lastSparkAt=t;const amount=Math.random()<.4?2:1;for(let i=0;i<amount;i++){const sp=document.createElement('span');sp.className='cam-spark';sp.textContent=Math.random()>.48?'★':'✦';sp.style.left=(x+(Math.random()-.5)*20)+'px';sp.style.top=(y+(Math.random()-.5)*20)+'px';sp.style.color=sparkPalette[Math.floor(Math.random()*sparkPalette.length)];sp.style.setProperty('--dx',((Math.random()-.5)*40)+'px');sp.style.setProperty('--dy',(-16-Math.random()*30)+'px');sp.style.setProperty('--ttl',(.64+Math.random()*.2)+'s');camStars.appendChild(sp);setTimeout(()=>sp.remove(),950)}}
const msg=(t,ms=6000)=>{const m=$('#cmsg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',ms)};
const fire=(el,type)=>el&&el.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,composed:true,clientX:C.x,clientY:C.y,pointerId:99,pointerType:'touch',isPrimary:true,button:0,buttons:type=='pointerup'?0:1}));

function release(){if(C.el){fire(C.el,'pointerup');if(Math.hypot(C.x-C.sx,C.y-C.sy)<22){const b=C.el.closest('button,.sl');if(b)b.click()}C.el=null}C.pin=0;hc.classList.remove('pin');hc.textContent='👆'}
function handle(lm){const now=performance.now();
if(!lm){if(!C.lost)C.lost=now;if(now-C.lost>600){hc.style.display='none';release();ring(0);C.dw=null;C.init=0}return}
C.lost=0;hc.style.display='grid';
const W=innerWidth,H=innerHeight,m=(x,y)=>[Math.max(0,Math.min(1,((1-x)-.1)/.8))*W,Math.max(0,Math.min(1,(y-.1)/.8))*H];
const sz=Math.hypot(lm[0].x-lm[9].x,lm[0].y-lm[9].y)||.1,d=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y)/sz,pin=C.pin?d<.45:d<.3;
const[tx,ty]=pin?m((lm[4].x+lm[8].x)/2,(lm[4].y+lm[8].y)/2):m(lm[8].x,lm[8].y);
const f=!C.init;C.init=1;C.x=f?tx:C.x+(tx-C.x)*.45;C.y=f?ty:C.y+(ty-C.y)*.45;hc.style.left=C.x+'px';hc.style.top=C.y+'px';sparkleAt(C.x,C.y,now);
if(pin&&!C.pin){C.pin=1;hc.classList.add('pin');hc.textContent='🤏';C.el=document.elementFromPoint(C.x,C.y);C.sx=C.x;C.sy=C.y;fire(C.el,'pointerdown');ring(0);C.dw=null}
else if(!pin&&C.pin)release();else if(pin&&C.el)fire(C.el,'pointermove');
if(!pin){const el=document.elementFromPoint(C.x,C.y)?.closest('button,.sl');if(el!==C.done)C.done=null;
if(el&&el!==C.done&&el===C.dw&&Math.hypot(C.x-C.dx,C.y-C.dy)<45){const p=(now-C.t0)/900;ring(p);if(p>=1){C.done=el;C.dw=null;ring(0);sfx.pop(3);el.click()}}
else if(!(el&&el===C.done)){C.dw=el;C.dx=C.x;C.dy=C.y;C.t0=now;ring(0)}}}
window.camHandle=handle;

async function start(){if(C.loading)return;if(C.on){stop();return}
const req=++C.requestId;C.loading=1;$('#bCam').disabled=true;
try{msg('Memuatkan kamera… sila benarkan kamera.');

cv.play().catch(()=>{if(req===C.requestId&&C.on)msg('Kamera dihidupkan. Jika video belum kelihatan, semak kebenaran kamera dan cuba hidupkan semula.',7500)});
msg('Webcam aktif! Video kini menjadi latar permainan. Sedang menyediakan pengesanan jari…',6500);
try{

let local=false;try{local=(await fetch('hand_landmarker.task',{method:'HEAD'})).ok}catch(e){}

}catch(e){if(req===C.requestId&&C.on)msg('Video webcam masih aktif. Pengesanan jari belum tersedia; boleh guna sentuhan atau mouse.',8500)}
}catch(e){if(req===C.requestId)stop('Webcam tidak dapat dihidupkan. Sila semak kebenaran kamera, atau guna sentuhan / mouse.')}}
$('#bCam').onclick=start})();
